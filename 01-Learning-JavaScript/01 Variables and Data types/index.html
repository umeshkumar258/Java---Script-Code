<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Styled Sections</title>

    <style>
        /* Base container style */
        .container {
            background-color: aqua;
            padding: 10px;
            margin: 10px 0;
        }

        /* Special section with two classes */
        .highlight.special {
            background-color: aquamarine;
            padding: 10px;
            margin: 10px 0;
        }

        h1, h2 {
            margin: 0;
        }
    </style>
</head>

<body>

    <div class="container highlight">
        <h1>I am good</h1>
    </div>

    <section class="highlight special">
        <h2>I am even better</h2>
    </section>

    <script src="variables.js"></script>
</body>
</html>
