<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Conditional Statements Practice</title>

    <!-- Internal CSS for simple styling -->
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            padding: 0;
            text-align: center;
        }

        header {
            background-color: #0077cc;
            color: white;
            padding: 20px;
        }

        main {
            margin-top: 40px;
        }

        h1 {
            margin: 0;
        }

        .box {
            background: white;
            padding: 20px;
            margin: 20px auto;
            width: 80%;
            max-width: 500px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        button {
            padding: 10px 20px;
            border: none;
            background-color: #0077cc;
            color: white;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #005fa3;
        }
    </style>
</head>

<body>

    <header>
        <h1>Conditional Statements Practice</h1>
    </header>

    <main>
        <div class="box">
            <p>Click the button to test a condition:</p>
            <button onclick="checkCondition()">Check Condition</button>
        </div>
    </main>

    <!-- External JS -->
    <script src="script.js"></script>

</body>
</html>
