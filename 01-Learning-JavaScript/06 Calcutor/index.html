<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Umesh | Web Developer</title>

    <!-- Basic Styling -->
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            line-height: 1.6;
            background: #f4f4f4;
            color: #333;
        }

        header {
            background: #333;
            color: #fff;
            padding: 20px;
            text-align: center;
        }

        section {
            padding: 20px;
            margin: 10px;
            background: #fff;
            border-radius: 8px;
        }

        h1, h2 {
            margin-bottom: 10px;
        }

        ul {
            list-style: square;
        }

        form input, form textarea {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            margin-bottom: 15px;
        }

        button {
            background: #333;
            color: white;
            padding: 10px;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background: #555;
        }

        footer {
            text-align: center;
            padding: 15px;
            background: #333;
            color: white;
        }
    </style>
</head>

<body>

    <!-- Header -->
    <header>
        <h1>Hi, I'm Umesh 👋</h1>
        <p>Aspiring Full Stack Developer</p>
    </header>

    <!-- Main Content -->
    <main>

        <!-- About -->
        <section id="about">
            <h2>About Me</h2>
            <p>
                I am an engineering student passionate about web development,
                JavaScript, and building real-world projects.
            </p>
        </section>

        <!-- Skills -->
        <section id="skills">
            <h2>My Skills</h2>
            <ul>
                <li>HTML</li>
                <li>CSS</li>
                <li>JavaScript</li>
                <li>Python</li>
            </ul>
        </section>

        <!-- Contact -->
        <section id="contact">
            <h2>Contact Me</h2>

            <form onsubmit="handleSubmit(event)">
                <label for="name">Name:</label>
                <input id="name" type="text" placeholder="Enter your name" required>

                <label for="email">Email:</label>
                <input id="email" type="email" placeholder="Enter your email" required>

                <label for="message">Message:</label>
                <textarea id="message" placeholder="Write your message" required></textarea>

                <button type="submit">Send Message</button>
            </form>
        </section>

    </main>

    <!-- Footer -->
    <footer>
        <p>© 2026 Umesh Kumar J B</p>
    </footer>

    <!-- JavaScript -->
    <script>
        function handleSubmit(event) {
            event.preventDefault();

            const name = document.getElementById("name").value.trim();
            const email = document.getElementById("email").value.trim();
            const message = document.getElementById("message").value.trim();

            if (!name || !email || !message) {
                alert("Please fill all fields!");
                return;
            }

            alert(`Thanks ${name}, your message has been sent!`);
        }
    </script>

</body>
</html>
