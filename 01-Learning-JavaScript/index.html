<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI To-Do App</title>

    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <div class="container">

        <h1>AI To-Do List</h1>

        <!-- Input Area -->
        <div class="input-section">
            <input type="text" id="taskInput" placeholder="Enter task..." />

            <button id="addTaskBtn">
                Add
            </button>
        </div>

        <!-- Task List -->
        <ul id="taskList"></ul>

        <!-- AI Assistant -->
        <div class="ai-box">

            <h2>AI Productivity Assistant</h2>

            <button id="aiBtn">
                Get AI Suggestion
            </button>

            <div id="aiResponse">
                AI response appears here...
            </div>

        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
